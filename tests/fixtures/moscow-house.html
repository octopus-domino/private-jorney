<html><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialState":{"mainService":{"queries":{"getItem(sample)":{"data":{"slug":"gidrometcentr-rossii","name":"Гидрометцентр России\n(Центральный институт погоды)","address":"г. Москва, Большой Предтеченский переулок, д. 13, стр. 1","coordinates":[55.75943295911467,37.56834975865027],"mainImage":"","textBlocks":[{"id":9462,"index":0,"textText":"<p>В конце 1920-х годов развитие промышленности, авиации, сельского хозяйства, водного транспорта и освоение новых территорий потребовало создания единой системы гидрометеорологического обеспечения страны. 7 августа 1929 года было принято решение об организации единой гидрометеорологической службы СССР.</p><p>1 января 1930 года в Москве начало работу Центральное бюро погоды СССР. Именно с этой даты ведётся история современного Гидрометцентра России.</p><p>Основной задачей бюро было обеспечение народного хозяйства прогнозами погоды. Для этого необходимо было собирать сведения с метеорологических станций, составлять синоптические карты, анализировать перемещение воздушных масс, атмосферных фронтов, циклонов и антициклонов.</p><p>По мере развития авиации, промышленности и транспорта требования к прогнозам становились всё сложнее. От синоптиков требовалось уже не только сообщить, будет ли завтра дождь или мороз, но и оценить условия для полётов, движения судов, сельскохозяйственных работ и функционирования крупных предприятий.</p>","textTitle":"Центральное бюро погоды"}],"announce":"<p><strong>История Гидрометцентра России — это история превращения прогноза погоды из работы с нанесёнными вручную синоптическими картами в сложную систему математического моделирования атмосферы, океана и суши. Созданный в Москве в 1930 году как Центральное бюро погоды, сегодня он объединяет фундаментальную науку и ежедневную работу по прогнозированию погоды и опасных гидрометеорологических явлений.</strong></p><p>&nbsp;&nbsp;&nbsp;</p><p>Гидрометцентр России начал работу 1 января 1930 года как Центральное бюро погоды СССР. 14 ноября 1936 года оно было преобразовано в Центральный институт погоды, а в 1943 году — в Центральный институт прогнозов. Во время Великой Отечественной войны его специалисты обеспечивали метеорологической и гидрологической информацией Генеральный штаб, авиацию и действующую армию. В послевоенные десятилетия здесь развивались гидродинамические и численные методы прогнозирования, создавались технологии работы с первыми электронно-вычислительными машинами. В 1965 году Центральный институт прогнозов и Объединённый вычислительный центр были объединены в Гидрометеорологический научно-исследовательский центр СССР. С 1992 года учреждение носит современное название, а с 1994 года имеет статус Государственного научного центра Российской Федерации. Сегодня Гидрометцентр занимается прогнозированием погоды и гидрологических процессов, исследованием атмосферы, океана и суши и предупреждением об опасных природных явлениях.</p>"}}}}}}}}</script></html>
